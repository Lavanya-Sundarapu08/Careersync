# ===================================================================
# CareerSync - Application Configuration
# Format: standard Spring Boot application.properties
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=careersync

# ===================================================================
# Database Configuration (PostgreSQL / Neon)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:careersync}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:database}}
spring.datasource.hikari.maximum-pool-size=10

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# ===================================================================
# Redis Cache Configuration (Upstash / Local Redis)
# ===================================================================
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
management.health.redis.enabled=false

# ===================================================================
# Mail / SMTP Configuration
# ===================================================================
# LOCAL DEV (Mailpit — zero setup, catches all emails at http://localhost:8025)
# spring.mail.host=localhost
# spring.mail.port=1025
# spring.mail.properties.mail.smtp.auth=false
# spring.mail.properties.mail.smtp.starttls.enable=false

# PRODUCTION OPTION A — Gmail SMTP (use an App Password, not your real password)
# 1. Google Account → Security → 2-Step Verification ON → App Passwords → generate one
# 2. Set these:
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-gmail@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-16-char-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# PRODUCTION OPTION B — Resend (https://resend.com, free tier: 100 emails/day)
# spring.mail.host=smtp.resend.com
# spring.mail.port=465
# spring.mail.username=resend
# spring.mail.password=${MAIL_PASSWORD:re_your_api_key_here}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.ssl.enable=true


# Virtual Threads (Java 21 / 25)
spring.threads.virtual.enabled=true

# ===================================================================
# CareerSync Business & Security Properties
# ===================================================================
# JWT Authentication
app.jwt.secret=${JWT_SECRET:change-this-super-secret-key-min-256-bits-for-hs256-signing-xxxxx}
app.jwt.access-token-expiry-minutes=15
app.jwt.refresh-token-expiry-days=7

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173}

# SLA Engine Configuration (Indian Standard Time: 09:30 to 18:30 IST)
app.sla.business-start=09:30
app.sla.business-end=18:30
app.sla.zone=Asia/Kolkata
app.sla.nudge-threshold-pct=0.80

# Cloud Resume Storage (AWS S3 / MinIO)
app.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.s3.region=${S3_REGION:us-east-1}
app.s3.bucket=${S3_BUCKET:careersync-resumes}
app.s3.access-key=${S3_ACCESS_KEY:minioadmin}
app.s3.secret-key=${S3_SECRET_KEY:minioadmin}
app.s3.presign-expiry-minutes=10

# Notification Sender
app.mail.from=no-reply@careersync.dev

# ===================================================================
# Actuator & Observability
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.mail.enabled=false
management.metrics.tags.application=careersync

# ===================================================================
# Logging
# ===================================================================
logging.level.com.careersync=INFO
logging.level.org.hibernate.SQL=WARN

# ===================================================================
# OAuth2 Social Login (Google)
# ===================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:458891735469-rlitj7s9f2jtvrhejd3fe17ktme5hr0e.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-client-secret-here}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
app.oauth2.authorized-redirect-uri=${APP_OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/callback}
